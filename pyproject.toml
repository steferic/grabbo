[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grabbo"
version = "2.0.0"
description = "Download audio from YouTube, SoundCloud, Bandcamp, and 1800+ sites"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0.0",
    "click>=8.0.0",
]

[project.scripts]
grabbo = "grabbo.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
